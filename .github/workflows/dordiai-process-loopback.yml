name: Dordiai owned current-process loopback calibration
on:
  push:
    branches: [dordiai-voices/audit-20261122]
    paths:
      - ".github/workflows/dordiai-process-loopback.yml"
      - "dordiai-voices/tools/windows_process_loopback_trial.py"
      - "dordiai-voices/tools/wasapi_loopback_calibration.py"
      - "dordiai-voices/tools/windows_process_loopback.cpp"
      - "dordiai-voices/tools/process_loopback_guard.py"
      - "dordiai-voices/tests/test_process_loopback_guard.py"
      - "dordiai-voices/tests/test_process_loopback_trial.py"
      - "dordiai-voices/tools/loopback_correlation.py"
      - "dordiai-voices/tests/test_loopback_correlation.py"
      - "dordiai-voices/tests/test_wasapi_loopback_calibration.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dordiai-owned-current-process-loopback-calibration
  cancel-in-progress: false
jobs:
  owned-loopback:
    if: >-
      github.repository == 'Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension' &&
      github.ref == 'refs/heads/dordiai-voices/audit-20261122' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[process-loopback]'))
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Preserve exact reviewed source bytes
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install only pinned CI waveform-analysis dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Validate synthetic PCM, native buffers, identity and cleanup without installation
        run: |
          python -m unittest discover -s dordiai-voices/tests -p 'test_process_loopback*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s dordiai-voices/tests -p test_wasapi_loopback_calibration.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s dordiai-voices/tests -p test_loopback_correlation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s dordiai-voices/tests -p test_virtual_audio_trial.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locate only an existing trusted Microsoft x64 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $vswhere
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Trusted existing Microsoft VS locator required' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $install) { throw 'Existing x64 MSVC workload unavailable; no compiler downloaded' }
          $version = (Get-Content -Raw -LiteralPath (Join-Path $install 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          if ($version -notmatch '^\d+(\.\d+){2,3}$') { throw 'Unexpected existing MSVC version' }
          $compiler = Join-Path $install ('VC\Tools\MSVC\' + $version + '\bin\Hostx64\x64\cl.exe')
          $signature = Get-AuthenticodeSignature -LiteralPath $compiler
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Trusted existing Microsoft compiler required' }
          $build = Join-Path $env:RUNNER_TEMP ('dordiai-process-helper-' + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $build) { throw 'Fresh owned compiler output required' }
          New-Item -ItemType Directory -Path $build | Out-Null
          "DORDIAI_PROCESS_HELPER_ROOT=$build" >> $env:GITHUB_ENV
          "DORDIAI_CL_EXE=$compiler" >> $env:GITHUB_ENV
          ("DORDIAI_VC_ENV=" + (Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat')) >> $env:GITHUB_ENV
      - name: Compile only the reviewed CI helper using the existing Windows SDK
        shell: cmd
        run: |
          call "%DORDIAI_VC_ENV%" > "%DORDIAI_PROCESS_HELPER_ROOT%\vcvars.log"
          if errorlevel 1 exit /b %errorlevel%
          "%DORDIAI_CL_EXE%" /nologo /std:c++17 /EHsc /W4 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DNOMINMAX /D_WIN32_WINNT=0x0A00 /Fo"%DORDIAI_PROCESS_HELPER_ROOT%\helper.obj" /Fe"%DORDIAI_PROCESS_HELPER_ROOT%\helper.exe" "%GITHUB_WORKSPACE%\dordiai-voices\tools\windows_process_loopback.cpp" /link /INCREMENTAL:NO ole32.lib mmdevapi.lib propsys.lib uuid.lib setupapi.lib cfgmgr32.lib bcrypt.lib
          if errorlevel 1 exit /b %errorlevel%
      - name: Validate native helper own-PID and ABI contracts without device access
        shell: pwsh
        run: |
          & (Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'helper.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind own source and compiled helper identities to the trusted compiler receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signature = Get-AuthenticodeSignature -LiteralPath $env:DORDIAI_CL_EXE
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Compiler trust changed' }
          $binary = Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'helper.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'dordiai-voices\tools\windows_process_loopback.cpp'
          $receipt = [ordered]@{
            format='dordiai-owned-process-loopback-build'; format_version=1; run_id=$env:GITHUB_RUN_ID
            compiler_authenticode_valid=$true; compiler_signer_subject=$signature.SignerCertificate.Subject
            compiler_signer_thumbprint=$signature.SignerCertificate.Thumbprint; compiler_path=$env:DORDIAI_CL_EXE
            compiler_sha256=(Get-FileHash -LiteralPath $env:DORDIAI_CL_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
            source_sha256=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            executable_sha256=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            executable_size_bytes=(Get-Item -LiteralPath $binary).Length
            product_runtime_modified=$false; physical_audio_verified=$false
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'build.json') -Encoding utf8NoBOM
      - name: Verify official package, existing trusted signatures and catalogue coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or
              $env:GITHUB_REPOSITORY -ne 'Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension' -or
              $env:RUNNER_ARCH -ne 'X64') { throw 'Owned hosted x64 scope required' }
          $package = Join-Path $env:RUNNER_TEMP ('dordiai-vb46-package-' + $env:GITHUB_RUN_ID)
          $verification = Join-Path $env:RUNNER_TEMP ('dordiai-vb46-verification-' + $env:GITHUB_RUN_ID)
          if ((Test-Path -LiteralPath $package) -or (Test-Path -LiteralPath $verification)) { throw 'Refusing existing roots' }
          New-Item -ItemType Directory -Path $package,$verification | Out-Null
          $zip = Join-Path $verification 'VBCABLE_Driver_Pack46.zip'
          Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip' -OutFile $zip
          if ((Get-Item -LiteralPath $zip).Length -ne 1324680 -or
              (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bc44e8974191a5a2427d6c979e2dab08dbb09925f3f435dfa2f0ba3e45b6eb90') { throw 'Pinned vendor ZIP mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $package
          $pins = python -c "import sys,json;sys.path.insert(0,'dordiai-voices/tools');import windows_virtual_audio_trial as t;print(json.dumps(t.EXPECTED))" | ConvertFrom-Json -AsHashtable
          foreach ($name in $pins.Keys) {
            if ((Get-FileHash -LiteralPath (Join-Path $package $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins[$name]) { throw ('Pinned member mismatch: '+$name) }
          }
          $thumbprints = @{
            'vbaudio_cable64_win10.cat'='6022340C9F4CB00307DF8DB036D392ADAC766212'
            'vbaudio_cable64_win10.sys'='762B6D6B2958E709F24C8DEA080150E2D4FB5889'
            'vbaudio_cable64arm_win10.sys'='762B6D6B2958E709F24C8DEA080150E2D4FB5889'
            'VBCABLE_Setup_x64.exe'='A77952D93229D0EC36E2543081EEA7D125732B9C'
          }
          foreach ($name in $thumbprints.Keys) {
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $package $name)
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $thumbprints[$name]) { throw ('Pinned trusted signer required: '+$name) }
          }
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $tools = @(Get-ChildItem -LiteralPath $sdk -Filter signtool.exe -Recurse -File | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Microsoft SDK SignTool unavailable; no replacement downloaded' }
          $signtool = $tools[0].FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $signtool
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Trusted Microsoft SDK verifier required' }
          $members = [ordered]@{}
          foreach ($name in @('vbMmeCable64_win10.inf','vbaudio_cable64_win10.sys','vbaudio_cable64arm_win10.sys')) {
            & $signtool verify /kp /v /c (Join-Path $package 'vbaudio_cable64_win10.cat') (Join-Path $package $name) 2>&1 | Tee-Object -FilePath (Join-Path $verification ($name+'.catalogue.log'))
            if ($LASTEXITCODE -ne 0) { throw ('Kernel-policy catalogue verification failed: '+$name) }
            $members[$name] = $true
          }
          $proof = [ordered]@{
            format='dordiai-vb46-catalogue-verification'; package_sha256='bc44e8974191a5a2427d6c979e2dab08dbb09925f3f435dfa2f0ba3e45b6eb90'
            catalogue_members=$members; authenticode_valid=$true; signtool_authenticode_valid=$true
            signtool=$signtool; vendor_finalization_reboot_instruction=$true
            installer_executed=$false; certificates_imported=$false; physical_audio_verified=$false; product_ready=$false
          }
          $proof | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $verification 'validation.json') -Encoding utf8NoBOM
          Write-Output ('VIRTUAL_AUDIO_CATALOGUE_VERIFICATION '+($proof | ConvertTo-Json -Depth 8 -Compress))
      - name: Start existing audio services and validate only the expected no-endpoint block
        shell: python
        run: |
          import json,os,pathlib,subprocess,sys
          sys.path.insert(0,"dordiai-voices/tools")
          from windows_virtual_audio_trial import check_audio_service_receipt
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/("dordiai-vb46-audio-"+os.environ["GITHUB_RUN_ID"])
          completed=subprocess.run([sys.executable,"dordiai-voices/tools/setup_audio_endpoint.py",
              "--output",str(output),"--ephemeral-ci","--start-existing-services"],check=False)
          report=json.loads((output/"audio-endpoint.json").read_text(encoding="utf-8"))
          state=check_audio_service_receipt(report,completed.returncode)
          print(json.dumps({"existing_service_receipt":state,"returncode":completed.returncode,
                            "wave_out_devices_after":report["wave_out_devices_after"],
                            "physical_audio_verified":False,"driver_installed_by_service_helper":False}),flush=True)
      - name: Capture only the own marker helper PID rendered to the exact new owned endpoint
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP ('dordiai-vb46-package-' + $env:GITHUB_RUN_ID)
          $validation = Join-Path $env:RUNNER_TEMP ('dordiai-vb46-verification-' + $env:GITHUB_RUN_ID + '\validation.json')
          $output = Join-Path $env:RUNNER_TEMP ('dordiai-vb46-process-loopback-' + $env:GITHUB_RUN_ID)
          python dordiai-voices/tools/windows_process_loopback_trial.py --package $package --validation $validation --output $output --helper (Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'helper.exe') --helper-build-receipt (Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'build.json') --ephemeral-ci
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            $reportPath = Join-Path $output 'loopback-trial.json'
            if (-not (Test-Path -LiteralPath $reportPath)) { throw 'Blocked trial has no guarded receipt' }
            $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
            if ($report.status -ne 'blocked' -or $report.cleanup_failure -eq $true -or
                ($report.cleanup.attempted -eq $true -and $report.cleanup.removed -ne $true) -or
                $report.physical_audio_verified -ne $false -or $report.reboot_performed -ne $false -or
                $report.microphone_capture_used -ne $false -or $report.privacy_settings_changed -ne $false -or
                $report.default_device_changed -ne $false -or $report.certificates_imported -ne $false -or
                $report.signature_enforcement_modified -ne $false) { throw 'Unrecognized blocked receipt or failed cleanup' }
            Write-Output 'Receipt confirms BLOCKED; no privacy/default/security changes attempted'
            exit 0
          }
          exit $code
      - name: Print bounded exact JSON receipts and own PCM checksums
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,stat
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/("dordiai-vb46-process-loopback-"+os.environ["GITHUB_RUN_ID"])
          rows=[]
          for name in ("loopback-trial.json","correlation.json","calibration/capture.json","calibration/reference.pcm","calibration/captured.pcm"):
              path=root/name
              if not path.exists():continue
              if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode) or path.stat().st_size>8*1024*1024:raise RuntimeError("Unexpected evidence file")
              raw=path.read_bytes()
              row={"filename":name,"size_bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}
              rows.append(row)
              if name.endswith(".json"):
                  json.loads(raw)
                  encoded=base64.b64encode(gzip.compress(raw,mtime=0)).decode("ascii")
                  print("LOOPBACK_JSON_META "+json.dumps(row),flush=True)
                  for index,start in enumerate(range(0,len(encoded),20000)):
                      print("LOOPBACK_JSON_GZIP_B64_"+str(index).zfill(3)+" "+encoded[start:start+20000],flush=True)
          print("LOOPBACK_EVIDENCE_FILES "+json.dumps(rows),flush=True)
      - name: Preserve exact metadata and own marker PCM only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-owned-current-process-loopback-calibration
          path: |
            ${{ runner.temp }}/dordiai-vb46-process-loopback-${{ github.run_id }}/loopback-trial.json
            ${{ runner.temp }}/dordiai-vb46-process-loopback-${{ github.run_id }}/correlation.json
            ${{ runner.temp }}/dordiai-vb46-process-loopback-${{ github.run_id }}/calibration/capture.json
            ${{ runner.temp }}/dordiai-vb46-process-loopback-${{ github.run_id }}/calibration/reference.pcm
            ${{ runner.temp }}/dordiai-vb46-process-loopback-${{ github.run_id }}/calibration/captured.pcm
            ${{ runner.temp }}/dordiai-process-helper-${{ github.run_id }}/build.json
            ${{ runner.temp }}/dordiai-vb46-verification-${{ github.run_id }}/*.json
            ${{ runner.temp }}/dordiai-vb46-verification-${{ github.run_id }}/*.log
          if-no-files-found: warn
          retention-days: 30
