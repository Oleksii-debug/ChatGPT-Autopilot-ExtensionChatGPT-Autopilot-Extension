name: Actual frozen NVDA Resource pure Path spelling cache
on:
  push:
    branches: [dordiai-voices/audit-20261122]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-nvda-word-cache:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[resource-path-nvda]')
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Preserve exact reviewed source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check new accounting and unchanged owned-host contracts
        shell: pwsh
        run: |
          python -m unittest discover -s dordiai-voices/tests -p test_windows_nvda_resource_path_cache_probe.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s dordiai-voices/tests -p test_windows_nvda_membership_host_probe.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dordiai-compact-native-word-membership
          run-id: 45027190211
          github-token: ${{ github.token }}
          path: dordiai-voices/native-membership-build
      - name: Real frozen NVDA archived baseline versus path-cache0 versus path-default
        run: >-
          python dordiai-voices/tools/windows_nvda_resource_path_cache_probe.py
          --dataset-dir dordiai-voices/native-membership-build
          --output dordiai-voices/native-resource-path-nvda
          --timeout 240
      - name: Preserve exact matching frozen-host JSON and bounded diagnostics
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib
          root=pathlib.Path('dordiai-voices/native-resource-path-nvda')
          for name in ('controller.json','host-probe.json'):
              path=root/name
              if not path.is_file():
                  print('Real Resource-path host report missing '+name,flush=True)
                  continue
              raw=path.read_bytes()
              if len(raw)>2*1024*1024:raise ValueError('Unexpected host report size')
              report=json.loads(raw)
              if name=='host-probe.json':
                  print('RESOURCE_PATH_NVDA_NONPASSING '+json.dumps([row for row in report.get('checks',[]) if row.get('status')!='passed']),flush=True)
                  for row in report.get('comparisons',[]):
                      print('RESOURCE_PATH_NVDA_MATCHED '+json.dumps({key:row.get(key) for key in ('round','variant','resource_open_ms','first_pass_manager97','reader1000','manager1000','statistics','cancellation_checked_before_cached_return','descriptor_change_rejected_even_after_cache_hit')}),flush=True)
              doc={'format':'dordiai-exact-frozen-nvda-external-resource-path-cache-json','format_version':1,
                  'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
                  'file':{'name':name,'sha256':hashlib.sha256(raw).hexdigest(),
                          'size_bytes':len(raw),'source_base64':base64.b64encode(raw).decode('ascii')}}
              encoded=json.dumps(doc,sort_keys=True,separators=(',',':')).encode()
              payload=base64.b64encode(gzip.compress(encoded,mtime=0)).decode('ascii')
              label='CONTROLLER' if name=='controller.json' else 'HOST'
              print('DORDIAI_RESOURCE_PATH_NVDA_'+label+'_JSON_SHA256 '+hashlib.sha256(encoded).hexdigest(),flush=True)
              for index in range(0,len(payload),24000):
                  print('DORDIAI_RESOURCE_PATH_NVDA_'+label+'_GZIP_B64_%03d '%(index//24000)+payload[index:index+24000],flush=True)
          log=root/'nvda.log'
          if log.is_file():print(log.read_text(encoding='utf-8',errors='replace')[-24000:],flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dordiai-real-nvda-resource-path-cache
          path: |
            dordiai-voices/native-resource-path-nvda/*.json
            dordiai-voices/native-resource-path-nvda/*.log
          if-no-files-found: warn
          retention-days: 30
