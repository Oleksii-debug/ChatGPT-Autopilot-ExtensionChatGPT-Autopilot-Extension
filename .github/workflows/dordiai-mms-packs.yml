      - name: Record package download and acceptance scope
        shell: python
        run: |
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ["REPORTS"])/"mms-pack-build.json").read_text(encoding="utf-8"))
          assert report["status"]=="passed" and report["package_count"]==29
          text=["29 verified optional native FP32 packages are attached separately to this run.",
