name: Dordiai voices validation and Windows probes

on:
  push:
    branches: [dordiai-voices/audit-20261122]
    paths: ["dordiai-voices/**", ".github/workflows/dordiai-voices.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dordiai-voices-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[windows]') }}
  cancel-in-progress: true

jobs:
  resource-diagnostics:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[diagnose-resources]')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Preserve exact source bytes
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dordiai-voices-development-core
          path: dordiai-voices/dist
          run-id: 45000863624
          github-token: ${{ github.token }}
      - name: Verify immutable core6 before fixed diagnostics
        shell: python
        run: |
          import hashlib,pathlib
          path=pathlib.Path("dordiai-voices/dist/dordiai-voices-0.13.1-dev.6.nvda-addon")
          with path.open("rb") as stream:
              digest=hashlib.file_digest(stream,"sha256").hexdigest()
          if digest!="ee60a000b3ea4387c2baf2afbbb252fd886b603d4e532220e62f29bf9dc465c8":
              raise RuntimeError("Immutable diagnostic core6 mismatch")
      - name: Inspect exact private runtime resource failures
        run: python dordiai-voices/tools/windows_resource_diagnostics.py --addon dordiai-voices/dist/dordiai-voices-0.13.1-dev.6.nvda-addon --output dordiai-voices/resource-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dordiai-voices-fixed-resource-diagnostics
          path: |
            dordiai-voices/resource-diagnostics/report.json
            dordiai-voices/resource-diagnostics/child-stderr.log
          if-no-files-found: warn
          retention-days: 7

  nvda-diagnostics:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-nvda]')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Preserve exact source bytes during Windows checkout
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse the immutable development core for loader diagnostics
        uses: actions/download-artifact@v4
        with:
          name: dordiai-voices-development-core
          path: dordiai-voices/dist
          run-id: 45002685422
          github-token: ${{ github.token }}
      - name: Verify exact previously tested archive bytes
        shell: python
        run: |
          import hashlib, pathlib
          path = pathlib.Path("dordiai-voices/dist/dordiai-voices-0.13.1-dev.7.nvda-addon")
          with path.open("rb") as stream:
              actual = hashlib.file_digest(stream, "sha256").hexdigest()
          # Artifact origin is pinned to the completed dev7 build run above.
          # Record outer SHA and verify every payload checksum before execution.
          import json,subprocess,sys,zipfile
          print(json.dumps({"verified_run":45002685422,"core_archive_sha256":actual,"core_archive_bytes":path.stat().st_size}),flush=True)
          subprocess.run([sys.executable,"dordiai-voices/tools/verify_release.py",str(path)],check=True)
          with zipfile.ZipFile(path) as archive:
              manifest=json.loads(archive.read("dordiai-release.json"))
          if manifest.get("version")!="0.13.1-dev.7":
              raise RuntimeError("Diagnostic core version does not match pinned build run")
      - name: Probe the actual NVDA child environment
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          root = pathlib.Path("dordiai-voices")
          subprocess.run([sys.executable, str(root / "tools/setup_audio_endpoint.py"), "--output", str(root / "windows-results/audio"), "--ephemeral-ci", "--start-existing-services"], check=False)
          command = [sys.executable, str(root / "tools/windows_nvda_probe.py"), "--addon", str(root / "dist/dordiai-voices-0.13.1-dev.7.nvda-addon"), "--output", str(root / "windows-results/nvda"), "--fatal-recovery-probe"]
          audio = root / "windows-results/audio/audio-endpoint.json"
          if audio.is_file() and json.loads(audio.read_text(encoding="utf-8")).get("wave_out_devices_after") == 0:
              command.append("--headless-ui-probe")
          subprocess.run(command, check=True)
      - name: Collect bounded diagnostic evidence
        if: always()
        run: python dordiai-voices/tools/collect_windows_evidence.py --source dordiai-voices/windows-results --output dordiai-voices/windows-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dordiai-voices-nvda-loader-diagnostics
          path: dordiai-voices/windows-evidence
          if-no-files-found: warn
          retention-days: 7

  artifact-diagnostics:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[diagnose-nvda]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover only small diagnostics from the previous Windows artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python dordiai-voices/tools/read_action_artifact.py --repo "${{ github.repository }}" --artifact-id 14746558395 --output dordiai-voices/diagnosed-windows-evidence
      - name: Print bounded fixed-input worker diagnostics
        if: always()
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path("dordiai-voices/diagnosed-windows-evidence")
          for path in sorted(root.rglob("*stderr.log")):
              text = path.read_bytes()[-65536:].decode("utf-8", errors="replace")
              print("FIXED ENGINE STDERR " + path.relative_to(root).as_posix(), flush=True)
              print(text.encode("ascii", errors="backslashreplace").decode("ascii"), flush=True)
          for path in root.rglob("nvda-probe.json"):
              report = json.loads(path.read_text(encoding="utf-8"))
              print("NVDA SUMMARY " + json.dumps({key: report.get(key) for key in ("status", "worker_bootstrap", "native_import_diagnostics", "initial_smoke_predevice_latency", "api_latency", "injected_fatal_recovery", "pcm_metrics")}, ensure_ascii=True), flush=True)
      - name: Encode bounded original JSON evidence for durable checkpoint
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path("dordiai-voices/diagnosed-windows-evidence")
          files={}
          for path in sorted(root.rglob("*.json")):
              raw=path.read_bytes()
              files[path.relative_to(root).as_posix()]={"sha256":hashlib.sha256(raw).hexdigest(),"size_bytes":len(raw),"source_base64":base64.b64encode(raw).decode("ascii")}
          document={"format":"dordiai-exact-windows-json-evidence","format_version":1,"run_id":45002685422,"artifact_id":14746558395,"scope":"Exact engineering reports; recording sink never certifies physical audio or pronunciation","files":files}
          compressed=gzip.compress(json.dumps(document,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8"),mtime=0)
          print("DORDIAI_BUNDLE_SHA256 "+hashlib.sha256(compressed).hexdigest(),flush=True)
          print("DORDIAI_BUNDLE_B64 "+base64.b64encode(compressed).decode("ascii"),flush=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dordiai-voices-recovered-windows-diagnostics
          path: dordiai-voices/diagnosed-windows-evidence
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime regression tests
        run: python -m pip install -r dordiai-voices/tests/requirements.txt
      - name: Run runtime regression tests
        run: python -m unittest discover -s dordiai-voices/tests -v

  windows-probes:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
    steps:
      - name: Preserve exact source bytes during Windows checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows runtime regression tests
        run: python -m pip install -r dordiai-voices/tests/requirements.txt
      - name: Run Windows runtime regression tests
        run: python -m unittest discover -s dordiai-voices/tests -v
      - uses: actions/cache/restore@v4
        id: audited_baseline
        with:
          path: dordiai-voices/packages/0.12.2
          key: dordiai-main-107ed71bf25569c770506acd605ae042d9cae767e0088508b2d5eb03ef3f658c
      - name: Restore audited main baseline
        if: steps.audited_baseline.outputs.cache-hit != 'true'
        run: python dordiai-voices/tools/restore_main.py --cache "${{ runner.temp }}/dordiai-download" --discard-downloads
      - uses: actions/cache/save@v4
        if: steps.audited_baseline.outputs.cache-hit != 'true'
        with:
          path: dordiai-voices/packages/0.12.2
          key: dordiai-main-107ed71bf25569c770506acd605ae042d9cae767e0088508b2d5eb03ef3f658c
      - name: Build modular development release
        run: python dordiai-voices/tools/build_release.py
      - name: Verify archives and prepare engine probe
        shell: python
        run: |
          import pathlib, subprocess, sys, zipfile
          root = pathlib.Path("dordiai-voices")
          files = sorted(root.joinpath("dist").glob("*.zip")) + sorted(root.joinpath("dist").glob("*.nvda-addon"))
          if not files:
              raise RuntimeError("No release archives were built")
          subprocess.run([sys.executable, str(root / "tools/verify_release.py"), *map(str, files)], check=True)
          addon = next(root.joinpath("dist").glob("*.nvda-addon"))
          with zipfile.ZipFile(addon) as archive:
              archive.extractall(root / "probe-package")
      - name: Actual Windows speech engine probe
        run: python dordiai-voices/tools/windows_engine_probe.py --package-root dordiai-voices/probe-package --output dordiai-voices/windows-results/engine
      - name: Install optional resources for Windows engine checks
        shell: python
        run: |
          import pathlib, sys
          root = pathlib.Path("dordiai-voices").resolve()
          package = root / "probe-package"
          sys.path.insert(0, str(package / "kx47Runtime"))
          import package_manager
          for archive in sorted(root.joinpath("dist").glob("*.zip")):
              package_manager.install_pack(archive, addon_root=package)
      - name: Actual additional-language engine probe
        run: python dordiai-voices/tools/windows_engine_probe.py --package-root dordiai-voices/probe-package --output dordiai-voices/windows-results/extra-engines --all-installed --repetitions 1
      - name: Actual letter and symbol worker audio structure
        if: always() && hashFiles('dordiai-voices/probe-package/kx47Runtime/nvda_worker.py') != ''
        run: python dordiai-voices/tools/windows_character_probe.py --package-root dordiai-voices/probe-package --output dordiai-voices/windows-results/characters
      - name: Actual pinned new MMS representative on the embedded Windows runtime
        if: always() && hashFiles('dordiai-voices/probe-package/kx47Runtime/nvda_worker.py') != ''
        run: python dordiai-voices/tools/windows_mms_probe.py --package-root dordiai-voices/probe-package --output dordiai-voices/windows-results/mms-ha --timeout 120
      - name: Actual explicitly enabled shared MMS graph on the embedded Windows runtime
        if: always() && hashFiles('dordiai-voices/probe-package/kx47Runtime/mms_family_sessions.py') != ''
        run: python dordiai-voices/tools/windows_mms_probe.py --package-root dordiai-voices/probe-package --output dordiai-voices/windows-results/mms-ha-shared --timeout 120 --shared-family
      - name: Reclaim isolated engine probe files
        if: always()
        shell: python
        run: |
          import pathlib, shutil
          package = pathlib.Path("dordiai-voices/probe-package").resolve()
          if package.is_dir():
              shutil.rmtree(package)
      - name: Actual NVDA integration probe
        if: always() && hashFiles('dordiai-voices/dist/*.nvda-addon') != ''
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          addon = next(pathlib.Path("dordiai-voices/dist").glob("*.nvda-addon"))
          subprocess.run([sys.executable, "dordiai-voices/tools/setup_audio_endpoint.py", "--output", "dordiai-voices/windows-results/audio", "--ephemeral-ci", "--start-existing-services"], check=False)
          command = [sys.executable, "dordiai-voices/tools/windows_nvda_probe.py", "--addon", str(addon), "--output", "dordiai-voices/windows-results/nvda", "--fatal-recovery-probe"]
          audio_report = pathlib.Path("dordiai-voices/windows-results/audio/audio-endpoint.json")
          if audio_report.is_file() and json.loads(audio_report.read_text(encoding="utf-8")).get("wave_out_devices_after") == 0:
              print("No actual audio endpoint: explicitly opting into recording PCM sink TEST DOUBLE for NVDA/GUI checks. WavePlayer and acoustic acceptance remain blocked.", flush=True)
              command.append("--headless-ui-probe")
          subprocess.run(command, check=True)
      - name: Print probe failures and collect bounded Windows diagnostics
        if: always()
        run: python dordiai-voices/tools/collect_windows_evidence.py --source dordiai-voices/windows-results --output dordiai-voices/windows-evidence
      - uses: actions/upload-artifact@v4
        id: windows_evidence
        if: always()
        with:
          name: dordiai-voices-windows-evidence
          path: dordiai-voices/windows-evidence
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        id: core_build
        if: always() && hashFiles('dordiai-voices/dist/*.nvda-addon') != ''
        with:
          name: dordiai-voices-development-core
          path: |
            dordiai-voices/dist/*.nvda-addon
            dordiai-voices/dist/release-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        id: piper_pack
        if: always() && hashFiles('dordiai-voices/dist/dordiai-european-piper-*.zip') != ''
        with:
          name: dordiai-voices-development-european-piper
          path: dordiai-voices/dist/dordiai-european-piper-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        id: slovak_pack
        if: always() && hashFiles('dordiai-voices/dist/dordiai-slovak-rhvoice-*.zip') != ''
        with:
          name: dordiai-voices-development-slovak-rhvoice
          path: dordiai-voices/dist/dordiai-slovak-rhvoice-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        id: wide_pack
        if: always() && hashFiles('dordiai-voices/dist/dordiai-wide-languages-*.zip') != ''
        with:
          name: dordiai-voices-development-wide-languages
          path: dordiai-voices/dist/dordiai-wide-languages-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Development artifact download links
        if: always()
        shell: python
        env:
          DORDIAI_CORE_URL: ${{ steps.core_build.outputs.artifact-url }}
          DORDIAI_PIPER_URL: ${{ steps.piper_pack.outputs.artifact-url }}
          DORDIAI_SLOVAK_URL: ${{ steps.slovak_pack.outputs.artifact-url }}
          DORDIAI_WIDE_URL: ${{ steps.wide_pack.outputs.artifact-url }}
          DORDIAI_EVIDENCE_URL: ${{ steps.windows_evidence.outputs.artifact-url }}
        run: |
          import json, os, pathlib
          lines = ["## Збірки dordiai-voices для перевірки", "",
                   "Це розробницькі артефакти, а не підтверджений публічний випуск. "
                   "Результати реальних перевірок містяться в окремому артефакті доказів.", "",
                   "Ядро та додаткові пакети завантажуються окремо. "
                   "Для завантаження потрібен вхід у GitHub. Артефакти зберігаються 7 днів.", ""]
          for label, key in [("Основний додаток NVDA", "DORDIAI_CORE_URL"),
                             ("Додаткові моделі Piper", "DORDIAI_PIPER_URL"),
                             ("Словацький рушій RHVoice", "DORDIAI_SLOVAK_URL"),
                             ("Додаткові мовні ресурси", "DORDIAI_WIDE_URL"),
                             ("Протоколи Windows і NVDA", "DORDIAI_EVIDENCE_URL")]:
              if os.environ.get(key):
                  lines.append(f"- [{label}]({os.environ[key]})")
          report = pathlib.Path("dordiai-voices/dist/release-build.json")
          if report.is_file():
              lines += ["", "Фактичні розміри архівів:", ""]
              for artifact in json.loads(report.read_text(encoding="utf-8"))["artifacts"]:
                  lines.append(f"- {artifact['filename']}: {artifact['size_bytes']:,} байтів.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
