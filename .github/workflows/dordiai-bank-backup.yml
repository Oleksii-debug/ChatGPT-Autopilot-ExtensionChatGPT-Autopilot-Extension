name: Dordiai unpublished prepared-bank binary backup

on:
  push:
    branches: [dordiai-voices/audit-20261122]
    paths:
      - ".github/workflows/dordiai-bank-backup.yml"
      - "dordiai-voices/tools/draft_core_backup.py"
      - "dordiai-voices/tools/draft_data_backup.py"
      - "dordiai-voices/tests/test_draft_data_backup.py"
      - "dordiai-voices/evidence/supplementary_bank_backup_identity.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dordiai-voices-prepared-bank-engineering-backup
  cancel-in-progress: false

jobs:
  owned-data-draft:
    if: >-
      github.repository == 'Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension' &&
      github.ref == 'refs/heads/dordiai-voices/audit-20261122' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[backup-banks]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test both owned draft backup helpers
        run: python -m unittest discover -s dordiai-voices/tests -p 'test_draft_*backup.py' -v
      - name: Read the reviewed Git-pinned generation identity
        id: pinned
        shell: python
        run: |
          import os,sys
          sys.path.insert(0,"dordiai-voices/tools")
          from draft_data_backup import read_identity
          spec=read_identity("dordiai-voices/evidence/supplementary_bank_backup_identity.json")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              print("run="+str(spec["source_run_id"]),file=output)
              print("artifact="+str(spec["source_artifact"]["id"]),file=output)
      - name: Download only the pinned data artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.pinned.outputs.artifact }}
          run-id: ${{ steps.pinned.outputs.run }}
          path: pinned-overlay
          merge-multiple: true
          repository: Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension
          github-token: ${{ github.token }}
      - name: Verify all180 new payloads and preserve a private draft backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python dordiai-voices/tools/draft_data_backup.py
          --identity dordiai-voices/evidence/supplementary_bank_backup_identity.json
          --input-directory pinned-overlay
          --receipt backup-evidence/dordiai-prepared-banks-backup-receipt.json
      - name: Retain the small receipt convenience copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dordiai-prepared-banks-draft-backup-receipt
          path: backup-evidence/*.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
