name: Actual source13 keyboard settings and owned restart supplement
on:
  push:
    branches: [dordiai-voices/audit-20261122]
  workflow_dispatch:
    inputs:
      render_route:
        type: choice
        options: [owned-virtual, existing-or-headless]
        default: owned-virtual
        description: Owned virtual endpoint closes saved-synth startup gate; existing/headless is a separate partial diagnostic
permissions:
  contents: read
  actions: read
jobs:
  settings-keyboard13:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[settings-keyboard13]')
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      DORDIAI_SETTINGS_ROUTE: ${{ inputs.render_route || 'owned-virtual' }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Preserve reviewed source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check keyboard supplement contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s dordiai-voices/tests -p "test_windows_nvda_settings_keyboard_probe.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile dordiai-voices/tools/windows_nvda_settings_keyboard_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require an actual successful source13 build before core acquisition
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib,importlib.util,json,os,pathlib,urllib.request
          root=pathlib.Path("dordiai-voices")
          expected={
              "tools/windows_virtual_audio_trial.py":"6539e4f770d93300fa96c272c9e281f767026e3f",
              "tools/process_loopback_guard.py":"d1d11c230e0feb3e1725383aa433b6d7a1528693",
              "tools/windows_process_loopback.cpp":"56f8ba819241ff020facf535d93d52600568b0a2",
              "tools/windows_nvda_probe.py":"ec3d93b5b6e3f92af70d0b989ca9e280db5a840f",
              "tools/validate_source13_integration_receipt.py":"1d785fb951625b424e4d620426640b5bfab3a73e",
              "tools/windows_nvda_settings_keyboard_probe.py":"23f10a086a99a51e1f9494cbcbc788afa5a02f59"}
          for name,pin in expected.items():
              path=root/name
              if path.is_symlink() or not path.is_file() or path.stat().st_size>1024*1024:raise ValueError("Probe source is not bounded/regular")
              raw=path.read_bytes()
              if hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()!=pin:raise ValueError("Reviewed probe source changed: "+name)
          spec=importlib.util.spec_from_file_location("_settings_pin",root/"tools/validate_source13_integration_receipt.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          pin=module.read_pin(root/"tools/data/source13_build_pin.json")
          repo=os.environ["GITHUB_REPOSITORY"]
          if repo!="Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension":raise ValueError("Only the owned project repository is allowed")
          def fetch(suffix):
              request=urllib.request.Request("https://api.github.com/repos/"+repo+suffix,
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"dordiai-settings-keyboard13-proof","Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          run=fetch("/actions/runs/"+str(pin["source_run_id"]))
          if (run.get("id")!=pin["source_run_id"] or run.get("head_sha")!=pin["source_commit"]
              or run.get("head_branch")!="dordiai-voices/audit-20261122" or run.get("path")!=pin["source_workflow_path"]
              or run.get("status")!="completed" or run.get("conclusion")!="success"
              or run.get("repository",{}).get("full_name")!=repo):raise ValueError("Not the exact successful owned source13 build")
          artifact=fetch("/actions/artifacts/"+str(pin["artifact_id"]))
          if (artifact.get("id")!=pin["artifact_id"] or artifact.get("name")!=pin["artifact_name"]
              or artifact.get("expired") is not False or artifact.get("size_in_bytes")!=pin["artifact_bytes"]
              or artifact.get("digest")!="sha256:"+pin["artifact_sha256"]
              or artifact.get("workflow_run",{}).get("id")!=pin["source_run_id"]
              or artifact.get("workflow_run",{}).get("head_sha")!=pin["source_commit"]):raise ValueError("Exact source13 artifact receipt differs")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              for key,value in {"SOURCE13_RUN":pin["source_run_id"],"SOURCE13_ARTIFACT":pin["artifact_name"],
                  "SOURCE13_SHA":pin["archive_sha256"],"SOURCE13_BYTES":pin["archive_bytes"]}.items():f.write(key+"="+str(value)+"\n")
          print(json.dumps({"source13_build_and_artifact_verified":True,"pin":pin}),flush=True)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.SOURCE13_ARTIFACT }}
          run-id: ${{ env.SOURCE13_RUN }}
          github-token: ${{ github.token }}
          path: dordiai-voices/dist-settings
      - name: Verify immutable actual addon
        shell: python
        run: |
          import hashlib,json,os,pathlib,zipfile
          files=list(pathlib.Path("dordiai-voices/dist-settings").glob("*.nvda-addon"))
          if len(files)!=1 or files[0].name!="dordiai-voices-0.13.1-dev.13.nvda-addon" or files[0].stat().st_size!=int(os.environ["SOURCE13_BYTES"]):raise ValueError("Exact source13 addon missing")
          with files[0].open("rb") as f:actual=hashlib.file_digest(f,"sha256").hexdigest()
          if actual!=os.environ["SOURCE13_SHA"]:raise ValueError("Actual source13 addon digest differs")
          with zipfile.ZipFile(files[0]) as z:
              if json.loads(z.read("dordiai-release.json")).get("version")!="0.13.1-dev.13":raise ValueError("Actual addon version differs")
      - name: Allocate current-run settings output name without creating the controller directory
        shell: python
        run: |
          import os,pathlib
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/("dordiai-settings-keyboard-"+os.environ["GITHUB_RUN_ID"])
          if output.exists():raise ValueError("Fresh current-run output required")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:f.write("DORDIAI_SETTINGS_OUTPUT="+str(output)+"\n")
      - name: Locate only an existing trusted Microsoft x64 compiler
        if: env.DORDIAI_SETTINGS_ROUTE == 'owned-virtual'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $vswhere
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Trusted existing Microsoft VS locator required' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $install) { throw 'Existing x64 MSVC workload unavailable; no compiler downloaded' }
          $version = (Get-Content -Raw -LiteralPath (Join-Path $install 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          if ($version -notmatch '^\d+(\.\d+){2,3}$') { throw 'Unexpected existing MSVC version' }
          $compiler = Join-Path $install ('VC\Tools\MSVC\' + $version + '\bin\Hostx64\x64\cl.exe')
          $signature = Get-AuthenticodeSignature -LiteralPath $compiler
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Trusted existing Microsoft compiler required' }
          $build = Join-Path $env:RUNNER_TEMP ('dordiai-process-helper-' + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $build) { throw 'Fresh owned compiler output required' }
          New-Item -ItemType Directory -Path $build | Out-Null
          "DORDIAI_PROCESS_HELPER_ROOT=$build" >> $env:GITHUB_ENV
          "DORDIAI_CL_EXE=$compiler" >> $env:GITHUB_ENV
          ("DORDIAI_VC_ENV=" + (Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat')) >> $env:GITHUB_ENV
      - name: Compile only the reviewed CI helper using the existing Windows SDK
        if: env.DORDIAI_SETTINGS_ROUTE == 'owned-virtual'
        shell: cmd
        run: |
          call "%DORDIAI_VC_ENV%" > "%DORDIAI_PROCESS_HELPER_ROOT%\vcvars.log"
          if errorlevel 1 exit /b %errorlevel%
          "%DORDIAI_CL_EXE%" /nologo /std:c++17 /EHsc /W4 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DNOMINMAX /D_WIN32_WINNT=0x0A00 /Fo"%DORDIAI_PROCESS_HELPER_ROOT%\helper.obj" /Fe"%DORDIAI_PROCESS_HELPER_ROOT%\helper.exe" "%GITHUB_WORKSPACE%\dordiai-voices\tools\windows_process_loopback.cpp" /link /INCREMENTAL:NO ole32.lib mmdevapi.lib propsys.lib uuid.lib setupapi.lib cfgmgr32.lib bcrypt.lib
          if errorlevel 1 exit /b %errorlevel%
      - name: Validate native helper own-PID and ABI contracts without device access
        if: env.DORDIAI_SETTINGS_ROUTE == 'owned-virtual'
        shell: pwsh
        run: |
          & (Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'helper.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind own source and compiled helper identities to the trusted compiler receipt
        if: env.DORDIAI_SETTINGS_ROUTE == 'owned-virtual'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signature = Get-AuthenticodeSignature -LiteralPath $env:DORDIAI_CL_EXE
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Compiler trust changed' }
          $binary = Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'helper.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'dordiai-voices\tools\windows_process_loopback.cpp'
          $receipt = [ordered]@{
            format='dordiai-owned-process-loopback-build'; format_version=1; run_id=$env:GITHUB_RUN_ID
            compiler_authenticode_valid=$true; compiler_signer_subject=$signature.SignerCertificate.Subject
            compiler_signer_thumbprint=$signature.SignerCertificate.Thumbprint; compiler_path=$env:DORDIAI_CL_EXE
            compiler_sha256=(Get-FileHash -LiteralPath $env:DORDIAI_CL_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
            source_sha256=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            executable_sha256=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            executable_size_bytes=(Get-Item -LiteralPath $binary).Length
            product_runtime_modified=$false; physical_audio_verified=$false
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:DORDIAI_PROCESS_HELPER_ROOT 'build.json') -Encoding utf8NoBOM
      - name: Verify official package, existing trusted signatures and catalogue coverage
        if: env.DORDIAI_SETTINGS_ROUTE == 'owned-virtual'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or
              $env:GITHUB_REPOSITORY -ne 'Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension' -or
              $env:RUNNER_ARCH -ne 'X64') { throw 'Owned hosted x64 scope required' }
          $package = Join-Path $env:RUNNER_TEMP ('dordiai-vb46-package-' + $env:GITHUB_RUN_ID)
          $verification = Join-Path $env:RUNNER_TEMP ('dordiai-vb46-verification-' + $env:GITHUB_RUN_ID)
          if ((Test-Path -LiteralPath $package) -or (Test-Path -LiteralPath $verification)) { throw 'Refusing existing roots' }
          New-Item -ItemType Directory -Path $package,$verification | Out-Null
          $zip = Join-Path $verification 'VBCABLE_Driver_Pack46.zip'
          Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip' -OutFile $zip
          if ((Get-Item -LiteralPath $zip).Length -ne 1324680 -or
              (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bc44e8974191a5a2427d6c979e2dab08dbb09925f3f435dfa2f0ba3e45b6eb90') { throw 'Pinned vendor ZIP mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $package
          $pins = python -c "import sys,json;sys.path.insert(0,'dordiai-voices/tools');import windows_virtual_audio_trial as t;print(json.dumps(t.EXPECTED))" | ConvertFrom-Json -AsHashtable
          foreach ($name in $pins.Keys) {
            if ((Get-FileHash -LiteralPath (Join-Path $package $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins[$name]) { throw ('Pinned member mismatch: '+$name) }
          }
          $thumbprints = @{
            'vbaudio_cable64_win10.cat'='6022340C9F4CB00307DF8DB036D392ADAC766212'
            'vbaudio_cable64_win10.sys'='762B6D6B2958E709F24C8DEA080150E2D4FB5889'
            'vbaudio_cable64arm_win10.sys'='762B6D6B2958E709F24C8DEA080150E2D4FB5889'
            'VBCABLE_Setup_x64.exe'='A77952D93229D0EC36E2543081EEA7D125732B9C'
          }
          foreach ($name in $thumbprints.Keys) {
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $package $name)
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $thumbprints[$name]) { throw ('Pinned trusted signer required: '+$name) }
          }
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $tools = @(Get-ChildItem -LiteralPath $sdk -Filter signtool.exe -Recurse -File | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Microsoft SDK SignTool unavailable; no replacement downloaded' }
          $signtool = $tools[0].FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $signtool
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Trusted Microsoft SDK verifier required' }
          $members = [ordered]@{}
          foreach ($name in @('vbMmeCable64_win10.inf','vbaudio_cable64_win10.sys','vbaudio_cable64arm_win10.sys')) {
            & $signtool verify /kp /v /c (Join-Path $package 'vbaudio_cable64_win10.cat') (Join-Path $package $name) 2>&1 | Tee-Object -FilePath (Join-Path $verification ($name+'.catalogue.log'))
            if ($LASTEXITCODE -ne 0) { throw ('Kernel-policy catalogue verification failed: '+$name) }
            $members[$name] = $true
          }
          $proof = [ordered]@{
            format='dordiai-vb46-catalogue-verification'; package_sha256='bc44e8974191a5a2427d6c979e2dab08dbb09925f3f435dfa2f0ba3e45b6eb90'
            catalogue_members=$members; authenticode_valid=$true; signtool_authenticode_valid=$true
            signtool=$signtool; vendor_finalization_reboot_instruction=$true
            installer_executed=$false; certificates_imported=$false; physical_audio_verified=$false; product_ready=$false
          }
          $proof | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $verification 'validation.json') -Encoding utf8NoBOM
          Write-Output ('VIRTUAL_AUDIO_CATALOGUE_VERIFICATION '+($proof | ConvertTo-Json -Depth 8 -Compress))
      - name: Start existing audio services and validate only the expected no-endpoint block
        shell: python
        run: |
          import json,os,pathlib,subprocess,sys
          sys.path.insert(0,"dordiai-voices/tools")
          from windows_virtual_audio_trial import check_audio_service_receipt
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/("dordiai-vb46-audio-"+os.environ["GITHUB_RUN_ID"])
          completed=subprocess.run([sys.executable,"dordiai-voices/tools/setup_audio_endpoint.py",
              "--output",str(output),"--ephemeral-ci","--start-existing-services"],check=False)
          report=json.loads((output/"audio-endpoint.json").read_text(encoding="utf-8"))
          state=check_audio_service_receipt(report,completed.returncode)
          print(json.dumps({"existing_service_receipt":state,"returncode":completed.returncode,
                            "wave_out_devices_after":report["wave_out_devices_after"],
                            "physical_audio_verified":False,"driver_installed_by_service_helper":False}),flush=True)
      - name: Actual keyboard UI save and same-profile process restart
        shell: python
        run: |
          import json,os,pathlib,subprocess,sys
          root=pathlib.Path("dordiai-voices")
          command=[sys.executable,str(root/"tools/windows_nvda_settings_keyboard_probe.py"),
              "--addon",str(root/"dist-settings/dordiai-voices-0.13.1-dev.13.nvda-addon"),
              "--pin",str(root/"tools/data/source13_build_pin.json"),
              "--output",os.environ["DORDIAI_SETTINGS_OUTPUT"],"--timeout","900"]
          if os.environ["DORDIAI_SETTINGS_ROUTE"]=="owned-virtual":
              temporary=pathlib.Path(os.environ["RUNNER_TEMP"]);run=os.environ["GITHUB_RUN_ID"]
              helper=pathlib.Path(os.environ["DORDIAI_PROCESS_HELPER_ROOT"])
              command += ["--owned-virtual-render","--ephemeral-ci",
                  "--package",str(temporary/("dordiai-vb46-package-"+run)),
                  "--validation",str(temporary/("dordiai-vb46-verification-"+run)/"validation.json"),
                  "--marker-helper",str(helper/"helper.exe"),"--marker-build-receipt",str(helper/"build.json")]
          elif os.environ["DORDIAI_SETTINGS_ROUTE"]=="existing-or-headless":
              audio=pathlib.Path(os.environ["RUNNER_TEMP"])/("dordiai-vb46-audio-"+os.environ["GITHUB_RUN_ID"])/"audio-endpoint.json"
              if json.loads(audio.read_text(encoding="utf-8"))["wave_out_devices_after"]==0:command.append("--headless-ui-probe")
          else:raise ValueError("Unknown explicitly bounded render route")
          subprocess.run(command,check=True)
      - name: Preserve bounded partial and final receipts without copying models
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib
          source=pathlib.Path(os.environ["DORDIAI_SETTINGS_OUTPUT"])
          target=pathlib.Path("dordiai-voices/settings-keyboard-evidence");target.mkdir(parents=True,exist_ok=True)
          records={}
          candidates={"keyboard-settings-supplement.json":source/"keyboard-settings-supplement.json",
              "edit-controller.json":source/"edit/windows-nvda-probe.json","resume-host.json":source/"resume/nvda-probe.json"}
          controller=source/"edit/windows-nvda-probe.json"
          if controller.is_file() and not controller.is_symlink() and controller.stat().st_size<=8*1024*1024:
              first=json.loads(controller.read_text(encoding="utf-8"))
              for field,name in (("probe_json","edit-host.json"),("nvda_log","edit-nvda.log")):
                  value=first.get(field)
                  if value:
                      path=pathlib.Path(value).resolve()
                      if not path.is_relative_to(source.resolve()):raise ValueError("Diagnostic escaped owned settings output")
                      candidates[name]=path
          candidates["resume-nvda.log"]=source/"resume/nvda.log"
          for name,path in candidates.items():
              if not path.is_file() or path.is_symlink():continue
              if path.stat().st_size>8*1024*1024:raise ValueError("Settings report exceeds quota")
              raw=path.read_bytes()
              if name.endswith(".json"):json.loads(raw)
              (target/name).write_bytes(raw)
              records[name]={"sha256":hashlib.sha256(raw).hexdigest(),"size_bytes":len(raw),"source_base64":base64.b64encode(raw).decode()}
          bundle=json.dumps({"format":"dordiai-settings-keyboard-exact-json","files":records},sort_keys=True,separators=(",",":")).encode()
          if len(bundle)>24*1024*1024:raise ValueError("Settings receipt bundle exceeds quota")
          packed=gzip.compress(bundle,mtime=0);payload=base64.b64encode(packed).decode()
          if len(payload)>1024*1024:raise ValueError("Settings log bundle exceeds quota")
          chunks=[payload[i:i+24000] for i in range(0,len(payload),24000)]
          print("DORDIAI_SETTINGS13_JSON_META "+json.dumps({"chunks":len(chunks),"json_sha256":hashlib.sha256(bundle).hexdigest(),"gzip_sha256":hashlib.sha256(packed).hexdigest()}),flush=True)
          for i,chunk in enumerate(chunks):print("DORDIAI_SETTINGS13_GZIP_B64_%03d "%i+chunk,flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dordiai-source13-settings-keyboard-${{ github.run_id }}
          path: dordiai-voices/settings-keyboard-evidence
          if-no-files-found: warn
          retention-days: 30
