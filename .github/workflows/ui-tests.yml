name: UI accessibility contract tests

on:
  push:
    branches: ["main", "source/0.9.19-canonical-convergence"]
    paths:
      - "src/ui/**"
      - "tests-regression/ui/**"
      - "package.json"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "src/ui/**"
      - "tests-regression/ui/**"
      - "package.json"
      - ".github/workflows/ui-tests.yml"

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:ui
