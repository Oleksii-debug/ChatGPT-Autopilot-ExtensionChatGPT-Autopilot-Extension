name: UI accessibility contract tests

on:
  push:
    branches: ["a3/ui-nvda-v0.1"]
    paths:
      - "src/ui/**"
      - "tests/ui/**"
      - "package.json"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "src/ui/**"
      - "tests/ui/**"
      - "package.json"

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:ui
