name: Interaction deterministic tests

on:
  push:
    branches: ["b4/phased-interaction-boundary"]
    paths:
      - "src/interaction/**"
      - "tests/interaction/**"
      - "tests/fixtures/chatgpt/**"
      - "package.json"
      - ".github/workflows/interaction-tests.yml"
  pull_request:
    paths:
      - "src/interaction/**"
      - "tests/interaction/**"
      - "tests/fixtures/chatgpt/**"
      - "package.json"
      - ".github/workflows/interaction-tests.yml"

permissions:
  contents: read

jobs:
  interaction-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run interaction adapter tests
        run: node --test tests/interaction/*.test.cjs
      - name: Syntax check interaction scripts
        run: |
          node --check src/interaction/chatgpt-adapter.js
          node --check src/interaction/content-script.js
