name: Core deterministic tests

on:
  push:
    branches: ["main", "source/0.9.19-canonical-convergence"]
    paths:
      - "src/core/**"
      - "src/shared/**"
      - "src/background/**"
      - "tests/**"
      - "tests-regression/core/**"
      - "tests-regression/integration/**"
      - "package.json"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "src/core/**"
      - "src/shared/**"
      - "src/background/**"
      - "tests/**"
      - "tests-regression/core/**"
      - "tests-regression/integration/**"
      - "package.json"
      - ".github/workflows/core-tests.yml"

permissions:
  contents: read

concurrency:
  # Collapse only superseded heads of the same pull request/workflow.
  # Push/main and manual runs use a unique run_id so exact-main evidence is preserved.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan4-model-contracts:
    name: Plan 4 model contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/core/ai-route-pool.js
      - run: node --check src/core/local-ai-provider.js
      - run: node --check src/core/ai-gateway-client.js
      - run: node --check companion/ai-gateway/gateway.mjs
      - run: node --test tests/plan4-contract-local-provider-hardening.test.mjs
      # Exact endpoint/credential identity reaches the actual HTTP gateway,
      # including read-only discovery and provider POST without external creds.
      - run: node --test tests/ai-gateway-server.test.mjs tests/ai-gateway-e2e.test.mjs
      # Reuse canonical integrated coverage: route dispatch/failover, provider transport,
      # credential broker and budget-admission/recovery, on both OS runners.
      - run: node --test tests/ai-route-pool.test.mjs tests/ai-orchestrator.test.mjs tests/ai-gateway-client.test.mjs tests/local-ai-provider.test.mjs tests/credential-broker.test.mjs tests/agent-budget-admission.test.mjs tests/resource-budget-governor.test.mjs
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:core
      - run: npm run test:web-det
      - run: node --test tests/plan4-contract-local-provider-hardening.test.mjs
