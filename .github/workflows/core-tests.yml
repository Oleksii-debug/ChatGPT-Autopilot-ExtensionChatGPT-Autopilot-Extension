name: Core deterministic tests

on:
  push:
    branches: ["main", "source/0.9.19-canonical-convergence"]
    paths:
      - "src/core/**"
      - "src/shared/**"
      - "src/background/**"
      - "tests/**"
      - "tests-regression/core/**"
      - "tests-regression/integration/**"
      - "package.json"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "src/core/**"
      - "src/shared/**"
      - "src/background/**"
      - "tests/**"
      - "tests-regression/core/**"
      - "tests-regression/integration/**"
      - "package.json"
      - ".github/workflows/core-tests.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:core
      - run: npm run test:web-det
