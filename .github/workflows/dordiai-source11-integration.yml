name: Dordiai source11 core10-resource build and actual native worker225
on:
  workflow_dispatch:
  push:
    branches: [dordiai-voices/audit-20261122]
    paths:
      - '.github/workflows/dordiai-source11-integration.yml'
      - 'dordiai-voices/tools/research/source11_afri_integration.py'
      - 'dordiai-voices/tests/test_source11_afri_integration.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: dordiai-source11-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-native-worker:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[source11-integration]')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Preserve original reviewed UTF8 and vendor byte identities
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only host regression-test requirements
        run: python -m pip install -r dordiai-voices/tests/requirements.txt
      - name: Run the full Windows source11 regression suite including morphology and native file replacement
        run: python -m unittest discover -s dordiai-voices/tests -v
      - name: Define owned short staging paths
        shell: pwsh
        run: |
          "SOURCE11_INPUTS=$env:RUNNER_TEMP/dordiai-source11-inputs" >> $env:GITHUB_ENV
          "SOURCE11_BUILD=$env:RUNNER_TEMP/dordiai-source11-build" >> $env:GITHUB_ENV
          "SOURCE11_PROBE=$env:RUNNER_TEMP/dordiai-source11-probe" >> $env:GITHUB_ENV
      - name: Acquire immutable completed core10 resource baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dordiai-voices-banks10-development-core
          run-id: 45021069771
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dordiai-source11-inputs/core10
      - name: Acquire exactly six own native source packages from successful225 preparation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dordiai-afri-six-optional-packs-45024624013
          run-id: 45024624013
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dordiai-source11-inputs/afri-packs
      - name: Acquire complete compact native word membership with original source notices
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dordiai-compact-native-word-membership
          run-id: 45027190211
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dordiai-source11-inputs/membership
      - name: Build actual source11 with exact core10 embedded banks and private runtime
        shell: pwsh
        run: |
          python dordiai-voices/tools/research/source11_afri_integration.py build --baseline-addon "$env:SOURCE11_INPUTS/core10/dordiai-voices-0.13.1-dev.10.nvda-addon" --source dordiai-voices/source/0.12.2 --membership "$env:SOURCE11_INPUTS/membership" --packs "$env:SOURCE11_INPUTS/afri-packs" --work "$env:SOURCE11_BUILD" --output dordiai-voices/dist/source11 --report dordiai-voices/source11-results/build.json
          if ($LASTEXITCODE -ne 0) { throw "Source11 assembly failed; no acceptance inferred" }
          Remove-Item -LiteralPath "$env:SOURCE11_INPUTS/core10/dordiai-voices-0.13.1-dev.10.nvda-addon" -Force
      - name: Actual packaged source11 native worker225 with outbound traffic blocked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programs = @(python -c "import json,sys;print(json.dumps(sorted(set((sys.executable,sys._base_executable)))))" | ConvertFrom-Json)
          $private = [IO.Path]::GetFullPath("$env:SOURCE11_PROBE/assembled-source11/kx47Runtime/python/python.exe")
          $programs += $private
          $programs = @($programs | Sort-Object -Unique)
          if (@(Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count -ne 0) { throw "Existing firewall profiles must be enabled" }
          $rules = @()
          try {
            foreach ($program in $programs) {
              $name = 'Dordiai-source11-' + [guid]::NewGuid().ToString('N')
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Enabled True -Profile Any -Program $program | Out-Null
              $rules += $name
            }
            $policy = @{ scope='owned-ephemeral-CI-VM-only'; programs=$programs; direction='Outbound'; action='Block'; physical_audio_verified=$false }
            New-Item -ItemType Directory -Path dordiai-voices/source11-results -Force | Out-Null
            $policy | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dordiai-voices/source11-results/network-policy.json
            python dordiai-voices/tools/research/source11_afri_integration.py probe --addon dordiai-voices/dist/source11/dordiai-voices-0.13.1-dev.11.nvda-addon --build-report dordiai-voices/source11-results/build.json --packs "$env:SOURCE11_INPUTS/afri-packs" --work "$env:SOURCE11_PROBE" --report dordiai-voices/source11-results/worker225.json --timeout 120
            if ($LASTEXITCODE -ne 0) { throw "Actual source11 native worker integration failed" }
          } finally {
            foreach ($name in $rules) { Remove-NetFirewallRule -Name $name -ErrorAction Continue }
          }
      - name: Actual three default language regressions on the same newly assembled source11
        shell: pwsh
        run: |
          python dordiai-voices/tools/windows_engine_probe.py --package-root "$env:SOURCE11_PROBE/assembled-source11" --output dordiai-voices/source11-results/default-engines --languages uk,en,ru --repetitions 1 --timeout 120
          if ($LASTEXITCODE -ne 0) { throw "Actual default-language worker regression" }
      - name: Preserve exact source11 proof flags and bounded report bytes
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path("dordiai-voices/source11-results")
          for name in ("build.json","worker225.json"):
              path=root/name
              if not path.is_file():
                  print("SOURCE11_MISSING_REPORT "+name,flush=True);continue
              raw=path.read_bytes()
              value=json.loads(raw)
              print("SOURCE11_ACTUAL_SUMMARY "+name+" "+json.dumps({key:value.get(key) for key in ("status","version","actual_selected_profile_cases","existing_prepared_bank_files_byte_identical","existing_private_files_byte_identical","nvda_verified","physical_audio_verified","typing_verified","product_ready")}),flush=True)
              packed=gzip.compress(raw,mtime=0)
              if len(packed)>512*1024:raise ValueError("Unexpected proof size")
              text=base64.b64encode(packed).decode()
              print("SOURCE11_EXACT_GZIP_SHA256 "+name+" "+hashlib.sha256(packed).hexdigest(),flush=True)
              chunks=[text[i:i+20000] for i in range(0,len(text),20000)]
              for i,chunk in enumerate(chunks,1):print("SOURCE11_EXACT_GZIP_B64 "+name+" "+str(i)+"/"+str(len(chunks))+" "+chunk,flush=True)
      - name: Preserve actual source11 build candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-source11-development-core-${{ github.run_id }}
          path: |
            dordiai-voices/dist/source11/*.nvda-addon
            dordiai-voices/dist/source11/release-build.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Preserve225 actual packaged-worker WAVs and all partial diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-source11-integration-evidence-${{ github.run_id }}
          path: dordiai-voices/source11-results/
          if-no-files-found: warn
          retention-days: 30
