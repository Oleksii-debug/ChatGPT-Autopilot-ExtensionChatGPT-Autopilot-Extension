name: Release package candidate

on:
  push:
    branches: ["main", "source/0.9.19-canonical-convergence"]
    paths:
      - "manifest.json"
      - "src/**"
      - "companion/**"
      - "tests/**"
      - "scripts/package-release.mjs"
      - "scripts/package-source.mjs"
      - "scripts/package-store.mjs"
      - "tests-regression/release/**"
      - "tests-regression/reliability/**"
      - "package.json"
      - "README.md"
      - "README.txt"
      - "CHANGES-*.txt"
      - "QA-*.txt"
      - ".github/workflows/release-package.yml"
  pull_request:
    paths:
      - "manifest.json"
      - "src/**"
      - "companion/**"
      - "tests/**"
      - "scripts/package-release.mjs"
      - "scripts/package-source.mjs"
      - "scripts/package-store.mjs"
      - "tests-regression/release/**"
      - "tests-regression/reliability/**"
      - "package.json"
      - "README.md"
      - "README.txt"
      - "CHANGES-*.txt"
      - "QA-*.txt"
      - ".github/workflows/release-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Collapse only superseded heads of the same pull request/workflow.
  # Push/main and manual runs use a unique run_id so exact-main evidence is preserved.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run deterministic Node qualification
        run: npm test
      - name: Build release candidate twice and verify deterministic bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npm run package:release
          candidate="dist/ChatGPT-Autopilot-${{ steps.release_meta.outputs.version }}.zip"
          test -f "$candidate"
          first_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          cp "$candidate" /tmp/ChatGPT-Autopilot-first.zip
          rm -rf dist
          npm run package:release
          test -f "$candidate"
          second_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          test "$first_sha" = "$second_sha"
          cmp -s /tmp/ChatGPT-Autopilot-first.zip "$candidate"
          unzip -t "$candidate"
          echo "release candidate deterministic SHA-256: $second_sha"
      - name: Upload release candidate ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Autopilot-${{ steps.release_meta.outputs.version }}-candidate
          path: dist/ChatGPT-Autopilot-${{ steps.release_meta.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


  windows-package:
    name: Windows release package gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release version
        id: release_meta
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'package.json version is missing' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Run release packaging regressions on Windows
        run: npm run test:release
      - name: Build release candidate twice on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath dist -Recurse -Force -ErrorAction SilentlyContinue
          npm run package:release
          $candidate = Join-Path $PWD 'dist/ChatGPT-Autopilot-${{ steps.release_meta.outputs.version }}.zip'
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw "Windows release candidate was not created: $candidate"
          }
          $firstHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          $firstCopy = Join-Path $env:RUNNER_TEMP 'ChatGPT-Autopilot-first-windows.zip'
          Copy-Item -LiteralPath $candidate -Destination $firstCopy -Force

          Remove-Item -LiteralPath dist -Recurse -Force
          npm run package:release
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw "Second Windows release candidate was not created: $candidate"
          }
          $secondHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($firstHash -ne $secondHash) {
            throw "Windows release package is not deterministic: $firstHash != $secondHash"
          }

          $extract = Join-Path $env:RUNNER_TEMP 'ChatGPT-Autopilot-windows-zip-check'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $candidate -DestinationPath $extract -Force
          if (-not (Test-Path -LiteralPath (Join-Path $extract 'ChatGPT-Autopilot-${{ steps.release_meta.outputs.version }}/manifest.json') -PathType Leaf)) {
            throw 'Windows release ZIP is missing the canonical manifest path'
          }
          Write-Output "Windows release candidate deterministic SHA-256: $secondHash"
      - name: Upload Windows-built release candidate ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Autopilot-${{ steps.release_meta.outputs.version }}-candidate-windows
          path: dist/ChatGPT-Autopilot-${{ steps.release_meta.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
