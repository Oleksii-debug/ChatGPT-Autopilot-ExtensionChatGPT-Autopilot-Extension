name: Dordiai isolated Arabic optional name bank mini proof
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [mini, full]
        default: mini
        description: Mini2names2profiles first; full1305 only after separate proof review
  push:
    branches: [dordiai-voices/audit-20261122]
    paths:
      - '.github/workflows/dordiai-ar-name-bank-mini.yml'
      - 'dordiai-voices/tools/research/probe_ar_name_banks.py'
      - 'dordiai-voices/tools/research/ar_name_bank_recipe.py'
      - 'dordiai-voices/tools/research/ar_ordinary_name_candidate.json'
      - 'dordiai-voices/tests/test_ar_name_banks.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: dordiai-ar-bank-mini-${{ github.ref }}
  cancel-in-progress: false
jobs:
  optional-name-bank-candidate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ar-bank-mini]') || contains(github.event.head_commit.message, '[ar-bank-full]')
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      BANK_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || contains(github.event.head_commit.message, '[ar-bank-full]') && 'full' || 'mini' }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - name: Preserve exact source byte identities
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install host-only test NumPy
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Run append-only key identity replacement and data validation regressions
        run: python -m unittest discover -s dordiai-voices/tests -p test_ar_name_banks.py -v
      - name: Create fresh owned research roots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP ('dordiai-ar29-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $stage) { throw 'Use a fresh owned research root' }
          New-Item -ItemType Directory -Path $stage | Out-Null
          New-Item -ItemType Directory -Path dordiai-voices/ar-name-bank-results | Out-Null
          "AR29_STAGE=$stage" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require pinned successful mini proof before full1305 preparation
        if: env.BANK_SCOPE == 'full'
        shell: python
        run: |
          import hashlib,json,pathlib
          base=pathlib.Path('dordiai-voices/evidence')
          def pinned(name,size,sha256,gitsha):
              raw=(base/name).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha256, 'Required reviewed mini proof bytes differ'
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==gitsha, 'Required reviewed mini Git object differs'
              return raw,json.loads(raw)
          receipt_raw,receipt=pinned('ar_name_bank_mini_actual_receipt.json',7545,'20133979723d9d915deac54c1d80ad61075c8efd03335ac09d733ac474fea816','7e49fbe1b9ab4d219540f4070ae44ee59506ca8c')
          report_raw,report=pinned('ar_name_bank_mini_windows_45051688399.json',17440,'74d9b6922da6c00dee02396375e678fc8631da5f253fab0cba11d13904b23168','274dd325e297db140c0fa5a4d879a3a836c4f703')
          # The reviewed JSON Git object is canonical LF. Independently bind it
          # to the byte-exact original Windows CRLF report inside the proof ZIP.
          assert b'\r' not in report_raw
          original=report_raw.replace(b'\n',b'\r\n')
          assert len(original)==18002 and hashlib.sha256(original).hexdigest()=='d4ba12515c8e0a4f012c5475a6d83d4d9d3a908a68a32b330a64e00d9436e960'
          assert receipt['run']==45051688399 and receipt['job']==137297981036
          assert receipt['status']=='passed-noninstallable-optional-bank-feasibility' and report['status']==receipt['status']
          assert report['scope']=='mini' and report['native_generation_calls']==2 and report['projection_calls']==4 and report['actual_clip_count']==4
          assert set(report['selected_profiles'])=={'viktoriia','oksana'} and set(report['selected_glyphs'])=={'ا','ء'}
          assert report['sample_rate']==24000 and report['native_input_rate']==22050 and report['planned_full_clip_count']==1305
          assert report['lookup']['warm_read_samples']==400 and len(report['lookup']['lookups'])==4
          for field in ['model_creation_and_subprocess_forbidden','resource_epoch_stale_rejected','wrong_mode_locale_glyph_and_profile_rejected']:
              assert report['lookup'][field] is True
          assert report['original_payloads_unchanged']==10230 and report['original180_banks_untouched'] is True and report['existing_bank_files_modified']==0
          assert report['previous3330_regenerated'] is False and report['all45_and29_prepared'] is False
          for field in ['nvda_verified','typing_verified','physical_audio_verified','pronunciation_verified','product_ready','production_registered']:
              assert report[field] is False
          assert receipt['full_plan']['actually_completed_here']==4 and receipt['full_plan']['full_batch_launched'] is False
          assert all(value is False for value in receipt['acceptance'].values())
          assert report['source_core_sha256']=='908a9825a8f3e1574d9d0a370ac0e35e1e1683eb04b998a937c312f0ce3ec573'
          assert report['source_wide_sha256']=='5e500e6f5a217a39023835352c8b59761cf6d1aff5063376ca96b24fbb8df262'
          gate={'format':'dordiai-ar-bank-full-pinned-mini-precondition','status':'passed','required_mini_run':45051688399,'receipt_git_blob':'7e49fbe1b9ab4d219540f4070ae44ee59506ca8c','reviewed_report_git_blob':'274dd325e297db140c0fa5a4d879a3a836c4f703','original_raw_report_sha256':hashlib.sha256(original).hexdigest(),'full_batch_scope':'research preparation only, no installation/default switch/production13 edits','physical_audio_verified':False,'product_ready':False}
          pathlib.Path('dordiai-voices/ar-name-bank-results/full-precondition.json').write_text(json.dumps(gate,indent=2)+'\n',encoding='utf-8')
          print('AR_BANK_FULL_REVIEWED_MINI_PRECONDITION_PASS',flush=True)
      - name: Independently acquire hash-verified primary name table without redistributing the book
        shell: python
        run: |
          import hashlib,json,pathlib,urllib.request
          candidate=json.loads(pathlib.Path('dordiai-voices/tools/research/ar_ordinary_name_candidate.json').read_text(encoding='utf-8'))
          with urllib.request.urlopen(candidate['source']['url'],timeout=60) as response:
              raw=response.read(6*1024*1024+1)
          assert len(raw)==5475624 and raw.startswith(b'%PDF')
          assert hashlib.sha256(raw).hexdigest()=='940efb9723bab5f877c08dbb1f8bddfd8c79cfb62430c6e5874335406d91a385'
          report={'format':'arabic-ordinary-primary-acquisition','url':candidate['source']['url'],'size_bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'location':'Printed169/PDF170 Figure1','original_pdf_redistributed':False,'scope':'Source byte verification only; visual factual transcription reviewed separately; no pronunciation claim'}
          pathlib.Path('dordiai-voices/ar-name-bank-results/primary-source-acquisition.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Acquire exact immutable source12 private runtime and converter
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14761553443'
          run-id: 45040668513
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ar29-original-core12
      - name: Download exact owned wide artifact without forwarding repository credentials
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $handler=[System.Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect=$false
          $client=[System.Net.Http.HttpClient]::new($handler)
          $request=[System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Get,"https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/14754247478/zip")
          $request.Headers.Authorization=[System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer',$env:GH_TOKEN)
          $request.Headers.UserAgent.ParseAdd('dordiai-own-arabic-name-research')
          $response=$client.SendAsync($request).GetAwaiter().GetResult()
          if ([int]$response.StatusCode -ne 302 -or $response.Headers.Location.Scheme -ne 'https') { throw 'Unexpected artifact redirect' }
          $anonymous=[System.Net.Http.HttpClient]::new()
          $stream=$anonymous.GetStreamAsync($response.Headers.Location).GetAwaiter().GetResult()
          $zip=Join-Path $env:AR29_STAGE 'wide-artifact.zip'
          $file=[System.IO.File]::Open($zip,[System.IO.FileMode]::CreateNew)
          try { $stream.CopyTo($file) } finally { $file.Dispose();$stream.Dispose();$anonymous.Dispose();$response.Dispose();$request.Dispose();$client.Dispose();$handler.Dispose() }
          if ((Get-Item $zip).Length -ne 552777798) { throw 'Wide wrapper byte count changed' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5e500e6f5a217a39023835352c8b59761cf6d1aff5063376ca96b24fbb8df262') { throw 'Wide wrapper SHA changed' }
      - name: Stage exact12 core and original shared acoustic subset with all per-file pins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $core=@(Get-ChildItem -Path "$env:RUNNER_TEMP/ar29-original-core12" -Recurse -Filter '*.nvda-addon')
          if ($core.Count -ne 1) { throw 'Expected exactly one immutable12 addon' }
          python dordiai-voices/tools/research/probe_ar_ordinary_names.py stage --core ($core[0].FullName) --wide "$env:AR29_STAGE/wide-artifact.zip" --candidate dordiai-voices/tools/research/ar_ordinary_name_candidate.json --output "$env:AR29_STAGE/core12"
          if ($LASTEXITCODE -ne 0) { throw 'Exact isolated Arabic shared-carrier stage failed' }
          python -c "import json,pathlib; p=pathlib.Path(r'$env:AR29_STAGE/core12/ar29-stage.json'); d=json.loads(p.read_text(encoding='utf-8')); d.pop('existing_payload_hashes'); pathlib.Path('dordiai-voices/ar-name-bank-results/stage-receipt.json').write_text(json.dumps(d,indent=2),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Stage receipt failed' }
      - name: Render2names2profiles first and prove exact prepared lookup without any model or subprocess
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $private=[IO.Path]::GetFullPath("$env:AR29_STAGE/core12/kx47Runtime/python/python.exe")
          if (@(Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count -ne 0) { throw 'Firewall profiles must remain enabled' }
          $rule='Dordiai-AR-BANK-'+[guid]::NewGuid().ToString('N')
          try {
            New-NetFirewallRule -Name $rule -DisplayName $rule -Direction Outbound -Action Block -Enabled True -Profile Any -Program $private | Out-Null
            @{scope='owned ephemeral CI VM and exact private Python only';network='outbound blocked before ML imports';physical_audio_verified=$false;production_registered=$false} | ConvertTo-Json | Set-Content -Encoding utf8 dordiai-voices/ar-name-bank-results/network-policy.json
            & $private -X utf8 -B (Resolve-Path dordiai-voices/tools/research/probe_ar_name_banks.py).Path --runtime "$env:AR29_STAGE/core12/kx47Runtime" --candidate (Resolve-Path dordiai-voices/tools/research/ar_ordinary_name_candidate.json).Path --output dordiai-voices/ar-name-bank-results/pcm --scope $env:BANK_SCOPE
            if ($LASTEXITCODE -ne 0) { throw 'Actual optional name-bank feasibility proof failed' }
          } finally {
            Remove-NetFirewallRule -Name $rule -ErrorAction Continue
          }
      - name: Preserve exact shared resource inventory even after stage failure
        if: always()
        shell: python
        run: |
          import os,pathlib,shutil
          if os.environ.get('AR29_STAGE'):
              p=pathlib.Path(os.environ['AR29_STAGE'])/'core12/ar29-shared-resource-inventory.json'
              if p.is_file():shutil.copyfile(p,'dordiai-voices/ar-name-bank-results/shared-resource-inventory.json')
      - name: Print exact bounded result with no listening or NVDA claims
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,pathlib
          p=pathlib.Path('dordiai-voices/ar-name-bank-results/pcm/report.json')
          if p.is_file():
              raw=p.read_bytes()
              if len(raw)>8*1024*1024:raise ValueError('Unexpected AR29 report size')
              print('AR_BANK_EXACT_JSON_SHA256 '+hashlib.sha256(raw).hexdigest(),flush=True)
              print('AR_BANK_EXACT_GZIP_BASE64 '+base64.b64encode(gzip.compress(raw,mtime=0)).decode(),flush=True)
          else:print('AR_BANK_REPORT_NOT_CREATED',flush=True)
      - name: Preserve NEW bank files and bounded partial proof even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-ar-bank-mini-name-candidate-${{ github.run_id }}
          path: dordiai-voices/ar-name-bank-results
          if-no-files-found: warn
          retention-days: 90
