name: Dordiai isolated voice removal candidate

on:
  workflow_dispatch:
  push:
    branches: [dordiai-voices/audit-20261122]

permissions:
  contents: read

jobs:
  windows-candidate-only:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[voice-removal-candidate]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve exact reviewed bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only host regression-test requirements
        run: python -m pip install -r dordiai-voices/tests/requirements.txt
      - name: Verify isolation guards on unchanged checkout
        shell: pwsh
        run: python -m unittest discover -s dordiai-voices/tests -p test_voice_removal_candidate_gate.py -v
      - name: Execute reviewed overlay only in temporary tree
        shell: pwsh
        run: python dordiai-voices/tools/research/voice_removal_candidate_gate.py "${{ github.workspace }}" "$env:RUNNER_TEMP/voice-removal-candidate-proof"
      - name: Retain candidate proof without isolated source or models
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-voice-removal-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/voice-removal-candidate-proof/gate.json
            ${{ runner.temp }}/voice-removal-candidate-proof/focused.json
            ${{ runner.temp }}/voice-removal-candidate-proof/focused.log
            ${{ runner.temp }}/voice-removal-candidate-proof/full.json
            ${{ runner.temp }}/voice-removal-candidate-proof/full.log
          if-no-files-found: error
          retention-days: 30
