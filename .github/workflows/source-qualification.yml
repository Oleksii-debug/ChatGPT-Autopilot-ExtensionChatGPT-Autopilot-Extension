name: Canonical source qualification

on:
  push:
    branches: ["source/0.9.19-canonical-convergence"]
    paths:
      - "SOURCE_TRUTH.json"
      - ".github/workflows/source-qualification.yml"
  pull_request:
    paths:
      - "SOURCE_TRUTH.json"
      - ".github/workflows/source-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate SOURCE_TRUTH and exact source projection
        shell: bash
        run: |
          set -euo pipefail
          node -e "const x=require('./SOURCE_TRUTH.json'); if(x.product_version!=='0.9.19'||x.git.pure_source_file_count!==318||x.git.pure_source_tree_sha!=='c26e518510172da7d1f250b825c073315865cec9') process.exit(1)"
          rm -rf /tmp/autopilot-pure-source /tmp/autopilot-pure-dist
          mkdir -p /tmp/autopilot-pure-source
          rsync -a --exclude=".git" --exclude=".github" --exclude="SOURCE_TRUTH.json" ./ /tmp/autopilot-pure-source/
          count="$(find /tmp/autopilot-pure-source -type f | wc -l | tr -d ' ')"
          test "$count" = "318"

      - name: Run exact projected Node qualification
        working-directory: /tmp/autopilot-pure-source
        run: npm test

      - name: Run native Chromium qualification with bounded startup retry
        working-directory: /tmp/autopilot-pure-source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run test:native-browser; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "native-browser qualification failed after 3 attempts" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Run Chromium keyboard and accessibility qualification
        working-directory: /tmp/autopilot-pure-source
        run: npm run test:chrome-ui

      - name: Static syntax and JSON gates
        working-directory: /tmp/autopilot-pure-source
        shell: bash
        run: |
          set -euo pipefail
          syntax_count=0
          while IFS= read -r -d '' f; do
            node --check "$f" >/dev/null
            syntax_count=$((syntax_count+1))
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) -print0)
          test "$syntax_count" = "210"
          json_count=0
          while IFS= read -r -d '' f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
            json_count=$((json_count+1))
          done < <(find . -type f -name "*.json" -print0)
          test "$json_count" = "6"
          echo "syntax=$syntax_count json=$json_count"

      - name: Sensitive-prefix gate
        working-directory: /tmp/autopilot-pure-source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          pats=[
              re.compile(rb"(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{16,}"),
              re.compile(rb"(?<![A-Za-z0-9])gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(rb"(?<![A-Za-z0-9])AIza[0-9A-Za-z_-]{20,}"),
              re.compile(rb"https://chatgpt\\.com/c/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:[/?#]|$)"),
          ]
          hits=[]
          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue
              b=p.read_bytes()
              for pat in pats:
                  if pat.search(b):
                      hits.append((p.as_posix(),pat.pattern.decode(errors="ignore")))
          if hits:
              raise SystemExit(f"sensitive-prefix hits: {hits[:20]}")
          print("sensitive-prefix scan: 0 hits")
          PY

      - name: Reproduce all recorded package hashes from pure source projection
        working-directory: /tmp/autopilot-pure-source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npm run package:release
          npm run package:source
          npm run package:store
          echo "b96496e8b57eac1689b9fd6c2093d6aefbad8d942bff44319c0ea568c532b7be  dist/ChatGPT-Autopilot-0.9.19.zip" | sha256sum -c -
          echo "e760a003bdfe98d59697fc99d737bd34661b2305959c657460c7c69277f59dfd  dist/ChatGPT-Autopilot-0.9.19-SOURCE.zip" | sha256sum -c -
          echo "a70a68946fbac8fb2777d9f8a9b1b6f761018a60ce37e8c41e852e33be64632c  dist/ChatGPT-Autopilot-0.9.19-CWS.zip" | sha256sum -c -
