name: Actual frozen NVDA native dictionary host
on:
  push:
    branches: [dordiai-voices/audit-20261122]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-nvda-host:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[membership-nvda-host]')
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Preserve pinned source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check owned host controller contracts
        run: |
          python -m py_compile dordiai-voices/tools/windows_nvda_membership_host_probe.py
          python -m unittest discover -s dordiai-voices/tests -p "test_windows_nvda_membership_host_probe.py" -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dordiai-compact-native-word-membership
          run-id: 45027190211
          github-token: ${{ github.token }}
          path: dordiai-voices/native-membership-build
      - name: Actual frozen NVDA imports and queries owned external dictionary
        run: >-
          python dordiai-voices/tools/windows_nvda_membership_host_probe.py
          --dataset-dir dordiai-voices/native-membership-build
          --output dordiai-voices/native-membership-nvda-host
          --timeout 180
      - name: Preserve exact host JSON and bounded diagnostics
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib
          root=pathlib.Path("dordiai-voices/native-membership-nvda-host")
          for name in ("controller.json","host-probe.json"):
              path=root/name
              if not path.is_file():print("Frozen NVDA membership missing "+name,flush=True);continue
              raw=path.read_bytes()
              if len(raw)>2*1024*1024:raise ValueError("Owned host report unexpectedly large")
              doc={"format":"dordiai-exact-frozen-nvda-membership-host-json","format_version":1,
                  "run_id":os.environ["GITHUB_RUN_ID"],"commit":os.environ["GITHUB_SHA"],
                  "file":{"name":name,"sha256":hashlib.sha256(raw).hexdigest(),"size_bytes":len(raw),
                      "source_base64":base64.b64encode(raw).decode("ascii")}}
              encoded=json.dumps(doc,sort_keys=True,separators=(",",":")).encode()
              payload=base64.b64encode(gzip.compress(encoded,mtime=0)).decode("ascii")
              label="CONTROLLER" if name=="controller.json" else "HOST"
              print("DORDIAI_NATIVE_NVDA_"+label+"_JSON_SHA256 "+hashlib.sha256(encoded).hexdigest(),flush=True)
              for i in range(0,len(payload),24000):print("DORDIAI_NATIVE_NVDA_"+label+"_GZIP_B64_%03d "%(i//24000)+payload[i:i+24000],flush=True)
          log=root/"nvda.log"
          if log.is_file():print(log.read_text(encoding="utf-8",errors="replace")[-24000:],flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dordiai-native-frozen-nvda-host
          path: |
            dordiai-voices/native-membership-nvda-host/*.json
            dordiai-voices/native-membership-nvda-host/*.log
          if-no-files-found: warn
          retention-days: 30
