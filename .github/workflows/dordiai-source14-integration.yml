name: Dordiai source14 exact-resource assembly and functional integration
on:
  push:
    branches: [dordiai-voices/audit-20261122]
    paths:
      - '.github/workflows/dordiai-source14-integration.yml'
      - 'dordiai-voices/tools/research/source14_integration.py'
      - 'dordiai-voices/tests/test_source14_integration.py'
      - 'dordiai-voices/tools/build_release.py'
      - 'dordiai-voices/source/0.12.2/manifest.ini'
      - 'dordiai-voices/source/0.12.2/kx47Runtime/wide_warmup.py'
      - 'dordiai-voices/source/0.12.2/kx47Runtime/nvda_worker.py'
      - 'dordiai-voices/source/0.12.2/kx47Runtime/native_multilingual.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dordiai-source14-integration
  cancel-in-progress: false
jobs:
  source14:
    if: >-
      github.repository == 'Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension' &&
      github.ref == 'refs/heads/dordiai-voices/audit-20261122' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[source14-build]'))
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Preserve reviewed UTF8 bytes
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.9'
      - name: Install pinned regression dependency
        run: python -m pip install numpy==2.3.5
      - name: Full Windows source14 regression suite
        run: python -m unittest discover -s dordiai-voices/tests -v
      - name: Validate source14 version and immutable13 receipt before acquisition
        shell: python
        run: |
          import importlib.util,pathlib
          root=pathlib.Path('dordiai-voices')
          spec=importlib.util.spec_from_file_location('source14_preflight',root/'tools/research/source14_integration.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.check_source_version(root/'source/0.12.2')
          pin=m.read_pin(root/'tools/data/source13_build_pin.json')
          m.source13()
          print({'source14_version':m.VERSION,'baseline_sha256':pin['archive_sha256'],'product_ready':False},flush=True)
      - name: Define fresh owned paths
        shell: pwsh
        run: |
          "SOURCE14_INPUT=$env:RUNNER_TEMP/dordiai-source14-input-$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV
          "SOURCE14_BUILD=$env:RUNNER_TEMP/dordiai-source14-build-$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV
          "SOURCE14_WORKER=$env:RUNNER_TEMP/dordiai-source14-worker-$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV
          "SOURCE14_NVDA=$env:RUNNER_TEMP/dordiai-source14-nvda-$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV
          "SOURCE14_INSTALLER=$env:RUNNER_TEMP/dordiai-source14-nvda-$env:GITHUB_RUN_ID.exe" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path dordiai-voices/source14-results | Out-Null
      - name: Verify the actual completed Actions core13 artifact identity
        shell: python
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          import json,os,pathlib,urllib.request
          pin=json.loads(pathlib.Path('dordiai-voices/tools/data/source13_build_pin.json').read_bytes())
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          run=get('runs/'+str(pin['source_run_id']));artifact=get('artifacts/'+str(pin['artifact_id']))
          if (run.get('conclusion')!='success' or run.get('head_sha')!=pin['source_commit']
              or artifact.get('name')!=pin['artifact_name'] or artifact.get('expired') is not False
              or artifact.get('size_in_bytes')!=pin['artifact_bytes']
              or artifact.get('digest')!='sha256:'+pin['artifact_sha256']
              or artifact.get('workflow_run',{}).get('id')!=pin['source_run_id']
              or artifact.get('workflow_run',{}).get('head_sha')!=pin['source_commit']):
              raise ValueError('Exact completed source13 Actions artifact differs')
          print({'completed_source13_artifact_verified':True,'product_ready':False},flush=True)
      - name: Acquire the actual immutable source13 core
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dordiai-source13-development-core-45049806570
          run-id: 45049806570
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dordiai-source14-input-${{ github.run_id }}
      - name: Assemble14 from exact13 without acoustic preparation
        shell: pwsh
        run: |
          python dordiai-voices/tools/research/source14_integration.py build --baseline-addon "$env:SOURCE14_INPUT/dordiai-voices-0.13.1-dev.13.nvda-addon" --source dordiai-voices/source/0.12.2 --work "$env:SOURCE14_BUILD" --output dordiai-voices/dist/source14 --report dordiai-voices/source14-results/build.json
          if ($LASTEXITCODE -ne 0) { throw 'Exact-resource source14 assembly failed' }
      - name: Acquire only the pinned official portable-NVDA installer before offline worker checks
        shell: python
        run: |
          import importlib.util,os,pathlib
          root=pathlib.Path('dordiai-voices')
          spec=importlib.util.spec_from_file_location('source14_installer',root/'tools/research/source14_integration.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          nvda=m.module('source14_official_nvda',root/'tools/windows_nvda_probe.py',m.NVDA_HELPER_BLOB)
          nvda.verified_installer(pathlib.Path(os.environ['SOURCE14_INSTALLER']))
      - name: Actual same14 packaged three-language worker with owned outbound blocks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Owned ephemeral Actions scope required' }
          if (@(Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count -ne 0) { throw 'Existing firewall profiles must remain enabled' }
          $programs=@(python -c "import json,sys;print(json.dumps(sorted(set((sys.executable,sys._base_executable)))))" | ConvertFrom-Json)
          $programs += [IO.Path]::GetFullPath("$env:SOURCE14_WORKER/assembled-source14/kx47Runtime/python/python.exe")
          $programs=@($programs | Sort-Object -Unique)
          $rules=@()
          $receipt=@{scope='owned-ephemeral-CI-only'; programs=$programs; direction='Outbound'; action='Block'; physical_audio_verified=$false; restored=$false}
          try {
            foreach ($program in $programs) {
              $name='Dordiai-source14-'+[guid]::NewGuid().ToString('N')
              New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Enabled True -Profile Any -Program $program | Out-Null
              $rules += $name
            }
            $receipt.rules=$rules
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dordiai-voices/source14-results/network-policy.json
            python dordiai-voices/tools/research/source14_integration.py worker --addon dordiai-voices/dist/source14/dordiai-voices-0.13.1-dev.14.nvda-addon --build-report dordiai-voices/source14-results/build.json --work "$env:SOURCE14_WORKER" --report dordiai-voices/source14-results/worker-default3.json --timeout 120 --ephemeral-ci
            if ($LASTEXITCODE -ne 0) { throw 'Actual same14 default3 worker failed' }
          } finally {
            foreach ($name in $rules) { Remove-NetFirewallRule -Name $name -ErrorAction Continue }
            $remaining=@($rules | Where-Object { Get-NetFirewallRule -Name $_ -ErrorAction SilentlyContinue })
            $receipt.restored=($remaining.Count -eq 0)
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dordiai-voices/source14-results/network-policy.json
            if (-not $receipt.restored) { throw 'Exact owned outbound rules were not removed' }
          }
      - name: Actual same14 NVDA core menus and typing with explicit headless functional scope
        shell: pwsh
        run: |
          python dordiai-voices/tools/research/source14_integration.py nvda --addon dordiai-voices/dist/source14/dordiai-voices-0.13.1-dev.14.nvda-addon --build-report dordiai-voices/source14-results/build.json --work "$env:SOURCE14_NVDA" --report dordiai-voices/source14-results/nvda-functional.json --installer-cache "$env:SOURCE14_INSTALLER" --timeout 1200 --ephemeral-ci
          if ($LASTEXITCODE -ne 0) { throw 'Actual same14 NVDA functional integration failed' }
      - name: Preserve bounded exact14 JSON receipts even after failure
        if: always()
        shell: python
        run: |
          import base64,gzip,hashlib,pathlib
          root=pathlib.Path('dordiai-voices/source14-results')
          for path in sorted(root.rglob('*.json')):
              raw=path.read_bytes()
              if len(raw)>8*1024**2:raise ValueError('Owned14 receipt exceeds bounded JSON limit')
              packed=gzip.compress(raw,mtime=0)
              if len(packed)>512*1024:raise ValueError('Owned14 receipt exceeds compressed limit')
              name=path.relative_to(root).as_posix();encoded=base64.b64encode(packed).decode()
              print('SOURCE14_JSON_META '+name+' '+hashlib.sha256(raw).hexdigest(),flush=True)
              for i in range(0,len(encoded),20000):print('SOURCE14_GZIP_B64 '+name+' '+str(i//20000)+' '+encoded[i:i+20000],flush=True)
      - name: Preserve only newly assembled source14 core
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-source14-development-core-${{ github.run_id }}
          path: |
            dordiai-voices/dist/source14/*.nvda-addon
            dordiai-voices/dist/source14/release-build.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - name: Preserve new14 functional evidence and partial diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-source14-integration-evidence-${{ github.run_id }}
          path: dordiai-voices/source14-results/
          if-no-files-found: warn
          retention-days: 30
