name: Canonical 0.9.19 source convergence

on:
  push:
    branches:
      - source/0.9.19-canonical-convergence
    paths:
      - ".source-convergence/**"
      - ".github/workflows/source-convergence-materialize.yml"

permissions:
  contents: write

concurrency:
  group: canonical-0-9-19-source-convergence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and materialize exact source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=".source-convergence/ChatGPT-Autopilot-0.9.19-SOURCE.zip"
          EXPECTED_SHA="e760a003bdfe98d59697fc99d737bd34661b2305959c657460c7c69277f59dfd"
          if [[ ! -f "$ZIP" ]]; then
            echo "No convergence ZIP remains; this is the expected no-op after materialization."
            exit 0
          fi

          actual="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA"

          rm -rf /tmp/autopilot-source-019
          mkdir -p /tmp/autopilot-source-019

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile

          zip_path = Path(".source-convergence/ChatGPT-Autopilot-0.9.19-SOURCE.zip")
          temp = Path("/tmp/autopilot-source-019")
          prefix = "ChatGPT-Autopilot-0.9.19-SOURCE/"

          with zipfile.ZipFile(zip_path) as z:
              infos = [i for i in z.infolist() if not i.is_dir()]
              if len(infos) != 318:
                  raise SystemExit(f"Expected 318 source files, got {len(infos)}")
              inventory = []
              for info in infos:
                  if not info.filename.startswith(prefix):
                      raise SystemExit(f"Unexpected ZIP path: {info.filename}")
                  rel = info.filename[len(prefix):]
                  pp = PurePosixPath(rel)
                  if not rel or pp.is_absolute() or ".." in pp.parts:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  raw = z.read(info)
                  target = temp / "root" / Path(*pp.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
                  header = b"blob " + str(len(raw)).encode() + b"\0"
                  inventory.append({
                      "path": rel,
                      "size": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "git_sha": hashlib.sha1(header + raw).hexdigest(),
                  })

          root = temp / "root"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          package = json.loads((root / "package.json").read_text(encoding="utf-8"))
          if manifest.get("version") != "0.9.19":
              raise SystemExit(f"manifest version mismatch: {manifest.get('version')}")
          if package.get("version") != "0.9.19":
              raise SystemExit(f"package version mismatch: {package.get('version')}")

          (temp / "inventory.json").write_text(
              json.dumps(inventory, ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          print(f"Verified and extracted {len(inventory)} exact source files")
          PY

          git config core.autocrlf false
          git config core.safecrlf false

          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          cp -a /tmp/autopilot-source-019/root/. .
          git add -A

          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          inventory = json.loads(Path("/tmp/autopilot-source-019/inventory.json").read_text(encoding="utf-8"))
          expected = {x["path"]: x["git_sha"] for x in inventory}

          disk = {
              p.relative_to(".").as_posix()
              for p in Path(".").rglob("*")
              if p.is_file() and ".git" not in p.parts and ".github" not in p.parts
          }
          if disk != set(expected):
              missing = sorted(set(expected) - disk)[:20]
              extra = sorted(disk - set(expected))[:20]
              raise SystemExit(f"Path-set mismatch missing={missing} extra={extra}")

          raw = subprocess.check_output(["git", "ls-files", "-s", "-z"])
          index = {}
          for rec in raw.split(b"\0"):
              if not rec:
                  continue
              meta, path = rec.split(b"\t", 1)
              _mode, sha, _stage = meta.decode().split()
              index[path.decode("utf-8")] = sha

          bad = [(p, sha, index.get(p)) for p, sha in expected.items() if index.get(p) != sha]
          if bad:
              raise SystemExit(f"Git blob mismatch count={len(bad)} sample={bad[:10]}")

          print("Exact-source index verification PASS: 318/318 blob SHAs")
          PY

          git config user.name "autopilot-source-convergence[bot]"
          git config user.email "autopilot-source-convergence[bot]@users.noreply.github.com"
          git commit -m "Converge exact qualified 0.9.19 source tree"
          git push origin HEAD:source/0.9.19-canonical-convergence
