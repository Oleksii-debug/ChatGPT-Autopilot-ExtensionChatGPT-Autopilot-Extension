name: Dordiai inspect existing MNI ONNX dynamic shapes

on:
  workflow_dispatch:
  push:
    branches: [dordiai-voices/audit-20261122]
    paths:
      - '.github/workflows/dordiai-mni-onnx-shapes.yml'
      - 'dordiai-voices/tools/research/inspect_mni_onnx_shapes.py'
      - 'dordiai-voices/tests/test_mni_onnx_shapes.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: dordiai-mni-onnx-shapes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mni-shapes]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated metadata parser only
        run: >-
          python -m pip install --only-binary=:all: numpy==2.2.6 onnx==1.17.0
      - name: Prove immutable pins and bounded metadata parser with synthetic fixtures
        run: python -m unittest discover -s dordiai-voices/tests -p test_mni_onnx_shapes.py -v
      - uses: actions/cache/restore@v4
        id: existing-cache
        with:
          path: ${{ runner.temp }}/dordiai-mni-existing-native
          key: mni-existing-native-81b5dc8fa87f3f6604264de435c05c9e6feb2deeb6d3e889f6808b6d6764d51a
      - name: Acquire only existing pinned Actions artifact without forwarding credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python dordiai-voices/tools/research/inspect_mni_onnx_shapes.py acquire
          --archive "${{ runner.temp }}/dordiai-mni-existing-native/proof.zip"
          --stage "${{ runner.temp }}/dordiai-mni-existing-stage"
      - uses: actions/cache/save@v4
        if: success() && steps.existing-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/dordiai-mni-existing-native
          key: mni-existing-native-81b5dc8fa87f3f6604264de435c05c9e6feb2deeb6d3e889f6808b6d6764d51a
      - name: Inspect actual attention reshape expressions and all405 original payloads offline
        run: >-
          python dordiai-voices/tools/research/inspect_mni_onnx_shapes.py inspect
          --stage "${{ runner.temp }}/dordiai-mni-existing-stage"
          --report "${{ github.workspace }}/output/mni-shape-inspection/proof.json"
      - name: Preserve read-only complete or partial metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-mni-onnx-shapes-${{ github.run_id }}
          path: output/mni-shape-inspection/
          if-no-files-found: warn
          compression-level: 0
