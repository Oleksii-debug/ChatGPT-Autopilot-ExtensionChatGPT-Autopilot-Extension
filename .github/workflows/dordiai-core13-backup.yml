name: Dordiai unpublished dev13 binary backup

on:
  push:
    branches: [dordiai-voices/audit-20261122]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dordiai-voices-dev13-engineering-backup
  cancel-in-progress: false

jobs:
  owned-draft-backup:
    if: >-
      github.repository == 'Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension' &&
      github.ref == 'refs/heads/dordiai-voices/audit-20261122' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[backup-dev13]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check ownership, corruption and no-overwrite regressions
        run: python -m unittest discover -s dordiai-voices/tests -p test_draft_core13_backup.py -v
      - name: Download only the pinned existing engineering artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14765535864
          path: pinned-core
          merge-multiple: true
          repository: Oleksii-debug/ChatGPT-Autopilot-ExtensionChatGPT-Autopilot-Extension
          run-id: 45049806570
          github-token: ${{ github.token }}
      - name: Verify exact core and preserve it in an owned unpublished draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python dordiai-voices/tools/draft_core13_backup.py
          --core pinned-core/dordiai-voices-0.13.1-dev.13.nvda-addon
          --receipt backup-evidence/dordiai-core-dev13-backup-receipt.json
      - name: Retain the small receipt as a convenience copy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dordiai-core-dev13-draft-backup-receipt
          path: backup-evidence/*.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
